<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Zone Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
	<link rel="stylesheet" href="site.css" />
	<script src="js/index.js" defer></script>
</head>

<body>
	<div class="container-fluid">
		<h1>Zone Manager</h1>
		<div class="row">
			<div class="col-md-4">
				<h2 data-zone="1" class="text-success">Grün</h2>
				<div class="row zone" id="zoneGreen">
				</div>
			</div>
			<div class="col-md-4">
				<h2 data-zone="2" class="text-warning">Gelb</h2>
				<div class="row zone" id="zoneYellow">
				</div>
			</div>
			<div class="col-md-4">
				<h2 data-zone="3" class="text-danger">Rot</h2>
				<div class="row zone" id="zoneRed">
				</div>
			</div>
		</div>
		<button id="btnAddNumber" class="btn btn-primary">+</button>
		<button id="btnReset" class="btn btn-danger">Reset</button>
	</div>

	<dialog id="dlgItem">
		<form method="dialog">
			<span>Name</span>
			<input type="text" name="name" value="" placeholder="Name" />
			<input type="submit" value="Ok" />
		</form>
		<table id="dlgItemHistory" class="table">
			<thead>
				<tr>
					<th>Wo</th>
					<th>Von</th>
					<th>Dauer</th>
					<th>Bis</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	</dialog>

	<dialog id="dlgSettings">
		<form method="dialog">
			<div class="mb-2">
				<label>
					<input type="checkbox" name="enable-warning" />
					Warnungen aktivieren
				</label>
			</div>
			<div class="mb-2">
				<input type="number" required name="warn-minutes" min="0" max="1440" />
				Minuten bis zur Warnung (gelb)
			</div>
			<div class="mb-2">
				<input type="number" required name="alert-minutes" min="0" max="1440" />
				Minuten bis zum Alarm (rot)
			</div>
			<input type="submit" value="Speichern" />
		</form>
	</dialog>

	<dialog id="dlgAddNumber">
		<form method="dialog">
			<span>Anzahl</span>
			<input type="number" name="number" value="0" min="0" max="99" />
			<input type="submit" value="Ok" />
		</form>
	</dialog>

	<dialog id="dlgReset">
		<form method="dialog">
			<h2 class="alert-danger">Daten löschen</h2>
			<p>Alle Daten löschen und die Anwendung zurücksetzen?</p>
			<input type="button" value="Ja" />
			<input type="submit" value="Nein" />
		</form>
	</dialog>
</body>

</html>
